    const j=closest(series.values,t),a=series.values[Math.max(0,Math.min(j-(series.values[j].x>t?1:0),series.values.length-2))],b=series.values[series.values.indexOf(a)+1];
    return {...series,y:a.y+(b.y-a.y)*(t-a.x)/(b.x-a.x)};
   });
   markers.data(interpolated,d=>d.key).attr('cx',x(t)).attr('cy',d=>y(d.y)).attr('display',d=>visibility[d.key]?null:'none');
   const mins=Math.round(t*60)+7*60,clock=String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
   tooltip.replaceChildren();const label=document.createElement('div');label.textContent=clock+' · E2 (pg/mL)';tooltip.appendChild(label);
   for(const s of interpolated.filter(s=>visibility[s.key])){const row=document.createElement('div');row.className='e2-tooltip-row';const name=document.createElement('span'),value=document.createElement('span');name.textContent=s.name;value.textContent=s.y.toFixed(2);row.append(name,value);tooltip.appendChild(row);}
   tooltip.style.display='block';
   const rr=root.getBoundingClientRect(),pr=plot.getBoundingClientRect(),tw=tooltip.getBoundingClientRect().width;
   tooltip.style.left=Math.max(0,Math.min(width-tw,cursorX+12))+'px';tooltip.style.top=(pr.top-rr.top+top+8)+'px';
  };
  svg.selectAll('[data-chart-hover-overlay]').data([null]).join('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','transparent')
   .on('pointermove',function(event){if(!pinned)renderHover(d3.pointer(event,this)[0]);})
   .on('pointerleave',()=>{if(!pinned){tooltip.style.display='none';guide.attr('display','none');markers.attr('display','none');}})
   .on('click',function(event){pinned=!pinned;renderHover(d3.pointer(event,this)[0]);});
  const boxes=[...axisX.selectAll('text').nodes(),...axisY.selectAll('text').nodes(),...svg.selectAll('.axis-title').nodes()].map(el=>el.getBoundingClientRect());
  root.dataset.labelsFit=String(boxes.every(b=>b.width>0&&b.left>=root.getBoundingClientRect().left-1&&b.right<=root.getBoundingClientRect().right+1));
  if(pinned&&lastHoverX!==null)renderHover(Math.min(lastHoverX,right));
  first=false;
 }
 for(const control of [param,change])control.addEventListener('change',()=>{pinned=false;tooltip.style.display='none';draw(true);});
 for(const button of root.querySelectorAll('[data-series]'))button.addEventListener('click',()=>{const key=button.dataset.series;visibility[key]=!visibility[key];button.setAttribute('aria-pressed',String(visibility[key]));draw(false);});
 new ResizeObserver(()=>draw(false)).observe(plot);draw(false);
})();
</script>
