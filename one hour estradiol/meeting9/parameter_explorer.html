      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;meeting9-hpg-explorer&#x27;);
      if (!root) return;

      const specs = [
        {key:&#x27;nGain&#x27;, label:&#x27;N gain (target ceiling)&#x27;, unit:&#x27;model units&#x27;, min:10, max:200, step:1, value:100, group:&#x27;gain&#x27;, digits:0},
        {key:&#x27;pulseJump&#x27;, label:&#x27;GnRH gain (pulse jump)&#x27;, unit:&#x27;model units&#x27;, min:5, max:800, step:1, value:50, group:&#x27;gain&#x27;, digits:0},
        {key:&#x27;lhGain&#x27;, label:&#x27;LH gain (GnRH → LH)&#x27;, unit:&#x27;&#x27;, min:1, max:30, step:1, value:3, group:&#x27;gain&#x27;, digits:0},
        {key:&#x27;e2Gain&#x27;, label:&#x27;E2 gain (LH → E2)&#x27;, unit:&#x27;&#x27;, min:1, max:25, step:1, value:15, group:&#x27;gain&#x27;, digits:0},
        {key:&#x27;nTurnover&#x27;, label:&#x27;N turnover&#x27;, unit:&#x27;h⁻¹&#x27;, min:1, max:5, step:1, value:1, group:&#x27;feedback&#x27;, digits:0},
        {key:&#x27;nE2Half&#x27;, label:&#x27;E2 → N midpoint&#x27;, unit:&#x27;pg/mL&#x27;, min:1, max:35, step:1, value:13, group:&#x27;feedback&#x27;, digits:0},
        {key:&#x27;periodHalf&#x27;, label:&#x27;N → period midpoint&#x27;, unit:&#x27;N units&#x27;, min:1, max:100, step:1, value:7, group:&#x27;pulse&#x27;, digits:0},
        {key:&#x27;amplitudeHalf&#x27;, label:&#x27;N → amplitude midpoint&#x27;, unit:&#x27;N units&#x27;, min:1, max:100, step:1, value:3, group:&#x27;pulse&#x27;, digits:0}
      ];

      const starting = Object.fromEntries(specs.map(s =&gt; [s.key, s.value]));

      let parameters = Object.fromEntries(specs.map(s =&gt; [s.key, s.value]));
      let latest = null;
      let pending = false;
      let saveTimer = null;

      function compatibleSavedState() {
        const candidate = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.modelContent;
        if (!candidate || candidate.schemaVersion !== 6) return null;
        const saved = candidate &amp;&amp; candidate.parameters;
        if (!saved) return null;
        const clean = {};
        for (const s of specs) {
          const v = Number(saved[s.key]);
          clean[s.key] = Number.isFinite(v) ? Math.min(s.max, Math.max(s.min, v)) : s.value;
        }
        return clean;
      }

      const restored = compatibleSavedState();
      if (restored) parameters = restored;

      function formatValue(s, value) {
        return `${Number(value).toFixed(s.digits)}${s.unit ? ` ${s.unit}` : &#x27;&#x27;}`;
      }

      function addSlider(s) {
        const hosts = {gain:&#x27;#m9-gain-controls&#x27;, feedback:&#x27;#m9-feedback-controls&#x27;, pulse:&#x27;#m9-pulse-controls&#x27;};
        const host = root.querySelector(hosts[s.group]);
        const wrap = document.createElement(&#x27;div&#x27;);
        wrap.className = &#x27;slider-wrap&#x27;;
        const label = document.createElement(&#x27;label&#x27;);
        label.className = &#x27;form-label&#x27;;
        label.htmlFor = `m9-${s.key}`;
        const header = document.createElement(&#x27;span&#x27;);
        header.className = &#x27;slider-label&#x27;;
        const name = document.createElement(&#x27;span&#x27;);
        name.textContent = s.label;
        const value = document.createElement(&#x27;span&#x27;);
        value.className = &#x27;slider-value tabular-nums&#x27;;
        value.id = `m9-${s.key}-value`;
        value.textContent = formatValue(s, parameters[s.key]);
        header.append(name, value);
        const input = document.createElement(&#x27;input&#x27;);
        input.type = &#x27;range&#x27;;
        input.className = &#x27;form-range&#x27;;
        input.id = `m9-${s.key}`;
        input.min = s.min;
        input.max = s.max;
        input.step = s.step;
        input.value = parameters[s.key];
        input.setAttribute(&#x27;aria-label&#x27;, s.label);
        input.addEventListener(&#x27;input&#x27;, () =&gt; {
          parameters[s.key] = Number(input.value);
          value.textContent = formatValue(s, parameters[s.key]);
          scheduleUpdate(true);
        });
        label.append(header, input);
        wrap.append(label);
        host.append(wrap);
      }
      specs.forEach(addSlider);

      function hillIncreasing(x, half, exponent) {
        const xp = Math.pow(Math.max(0, x), exponent);
        return xp / (Math.pow(half, exponent) + xp);
      }

      function hillDecreasing(x, half, exponent) {
        const hp = Math.pow(half, exponent);
        return hp / (hp + Math.pow(Math.max(0, x), exponent));
      }

      function simulate(p) {
        const dt = 1 / 600;
        const warmup = 96;
        const output = 72;
        const totalSteps = Math.round((warmup + output) / dt);
        const outputSteps = Math.round(output / dt);
        const kG = Math.log(2) / (1 / 15);
        const kLH = Math.log(2) / (1 / 3);
        const kE2 = Math.log(2) / (22 / 60);
        const hillCoefficient = 5;
        let N = p.nGain * hillDecreasing(15, p.nE2Half, hillCoefficient);
        let G = 0, LH = 5, E2 = 15, phi = 0;
        const stride = 30;
        const times = [], e2Values = [], lhValues = [];
        let unstable = false;

        for (let i = 0; i &lt; totalSteps; i++) {
          const period = 75 - 24 * hillIncreasing(N, p.periodHalf, hillCoefficient);
          const phiNew = phi + 60 * dt / period;
          const fires = Math.floor(phiNew) &gt; Math.floor(phi);
          const pulse = fires ? p.pulseJump * hillIncreasing(N, p.amplitudeHalf, hillCoefficient) : 0;
          phi = phiNew;

          const nTarget = p.nGain * hillDecreasing(E2, p.nE2Half, hillCoefficient);
          const nextN = N + dt * p.nTurnover * (nTarget - N);
          const nextG = G + dt * (-kG * G) + pulse;
          const nextLH = LH + dt * (p.lhGain * G - kLH * LH);
          const nextE2 = E2 + dt * (p.e2Gain * LH - kE2 * E2);
          N = nextN; G = nextG; LH = nextLH; E2 = nextE2;

          if (![N,G,LH,E2].every(Number.isFinite) || E2 &gt; 1e6 || E2 &lt; -1e3) {
            unstable = true;
            break;
          }
          if (i &gt;= totalSteps - outputSteps &amp;&amp; (i - (totalSteps - outputSteps)) % stride === 0) {
            times.push((i - (totalSteps - outputSteps)) * dt);
            e2Values.push(E2);
            lhValues.push(LH);
          }
        }
        return {times, e2Values, lhValues, unstable};
      }

      function median(values) {
        if (!values.length) return 0;
        const a = [...values].sort((x,y) =&gt; x-y);
        const m = Math.floor(a.length / 2);
        return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
      }

      function robustVariation(values) {
        if (values.length &lt; 2) return 0;
        const med = median(values);
        if (!med) return 0;
        return median(values.map(v =&gt; Math.abs(v - med))) / Math.abs(med);
      }

      function findPeaks(times, values) {
        if (values.length &lt; 5) return [];
        const min = Math.min(...values), max = Math.max(...values);
        const prominenceThreshold = 0.15 * (max - min);
        const candidates = [];
        const windowPoints = Math.max(2, Math.round(4 / (times[1] - times[0])));
        for (let i = 1; i &lt; values.length - 1; i++) {
          if (!(values[i] &gt; values[i-1] &amp;&amp; values[i] &gt;= values[i+1])) continue;
          let leftMin = values[i], rightMin = values[i];
          for (let j = Math.max(0, i-windowPoints); j &lt; i; j++) leftMin = Math.min(leftMin, values[j]);
          for (let j = i+1; j &lt;= Math.min(values.length-1, i+windowPoints); j++) rightMin = Math.min(rightMin, values[j]);
          const prominence = values[i] - Math.max(leftMin, rightMin);
          if (prominence &gt;= prominenceThreshold) candidates.push({i, t:times[i], y:values[i]});
        }
        const peaks = [];
        for (const c of candidates) {
          const last = peaks[peaks.length-1];
          if (last &amp;&amp; c.t - last.t &lt; 0.35) {
            if (c.y &gt; last.y) peaks[peaks.length-1] = c;
          } else peaks.push(c);
        }
        return peaks;
      }

      function orbitLabel(peaks, intervals) {
        const m = Math.min(peaks.length, intervals.length);
        if (m &lt; 6) return &#x27;Repeat: insufficient peaks&#x27;;
        const h = peaks.slice(-m).map(d =&gt; d.y);
        const iv = intervals.slice(-m);
        const hm = median(h), im = median(iv);
        for (let period = 1; period &lt;= Math.min(12, Math.floor(m/2)); period++) {
          let dh = 0, di = 0, n = 0;
          for (let i = period; i &lt; m; i++) {
            dh += Math.abs(h[i] - h[i-period]) / Math.max(Math.abs(hm), 1e-9);
            di += Math.abs(iv[i] - iv[i-period]) / Math.max(Math.abs(im), 1e-9);
            n++;
          }
          if (dh/n &lt; 0.03 &amp;&amp; di/n &lt; 0.03) return `Repeat: period-${period}`;
        }
        return &#x27;Repeat: &gt;12 peaks&#x27;;
      }

      function metricsFor(sim) {
        if (sim.unstable || !sim.e2Values.length) return {unstable:true};
        const min = Math.min(...sim.e2Values), max = Math.max(...sim.e2Values);
        const lhMin = Math.min(...sim.lhValues), lhMax = Math.max(...sim.lhValues);
        const peaks = findPeaks(sim.times, sim.e2Values);
        const intervals = [];
        for (let i=1; i&lt;peaks.length; i++) intervals.push((peaks[i].t-peaks[i-1].t)*60);
        const lhPeaks = findPeaks(sim.times, sim.lhValues);
        const lhIntervals = [];
        for (let i=1; i&lt;lhPeaks.length; i++) lhIntervals.push((lhPeaks[i].t-lhPeaks[i-1].t)*60);
        return {
          unstable:false, min, max, lhMin, lhMax, peaks, intervals, lhPeaks, lhIntervals,
          heightVariation:robustVariation(peaks.map(d =&gt; d.y)),
          spacingVariation:robustVariation(intervals),
          lhSpacingVariation:robustVariation(lhIntervals),
          repeat:orbitLabel(peaks, intervals),
          lhRepeat:orbitLabel(lhPeaks, lhIntervals),
          inRange:min &gt;= 7 &amp;&amp; max &lt;= 60,
          lhInRange:lhMin &gt;= 1 &amp;&amp; lhMax &lt;= 10
        };
      }

      function el(id) { return root.querySelector(id); }
      function svgNode(name, attrs={}) {
        const node = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, name);

    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
